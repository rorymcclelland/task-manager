<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22none%22 stroke=%22%232f5bd3%22 stroke-width=%222%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="page">
    <header class="top">
      <h1>Tasks</h1>
      <p class="count" id="count" aria-live="polite"></p>
      <!-- 2.2: the matrix is the default; the other views are one click (or v) away.
           Phase 4 adds Day (calendar beside the list) and Ahead (the next fortnight). -->
      <div class="view-switch" id="view-switch" role="group" aria-label="View">
        <button type="button" data-view="matrix" title="Matrix (v)">Matrix</button>
        <button type="button" data-view="day" title="Day: calendar and list side by side (v)">Day</button>
        <button type="button" data-view="ahead" title="Ahead: the next 14 days (v)">Ahead</button>
        <button type="button" data-view="list" title="List (v)">List</button>
      </div>
    </header>

    <!-- 1.3: capture. Focus it from anywhere with "n" or "/". -->
    <form id="capture" class="capture" autocomplete="off">
      <label for="capture-input" class="visually-hidden">Add a task</label>
      <input id="capture-input" name="text" type="text"
             placeholder="Add a task…  (#claude #gemini #local · !1–!4 · due:2026-10-31 · on:2026-10-20 at:14:00 · paste a link, or several lines)">
      <button type="submit">Add</button>
    </form>
    <p class="capture-error" id="capture-error" role="alert"></p>

    <!-- 1.2: filter the single list by where tasks came from. -->
    <nav class="filters" id="filters" aria-label="Filter by source"></nav>

    <!-- Phase 3: each source's last sync, and a button to sync now. -->
    <details class="sources" id="sources">
      <summary>
        <span class="sources-label">Sources</span>
        <span class="sources-chips" id="sources-chips"></span>
      </summary>
      <div class="sources-body" id="sources-body"></div>
    </details>

    <!-- 1.5: suggested duplicates appear here when there are any. -->
    <section class="duplicates" id="duplicates" hidden></section>

    <!-- 2.1: the Eisenhower matrix (default view). Drawn by app.js. -->
    <div id="matrix"></div>

    <!-- 4.1, 4.2: one day — calendar on the left, tasks to fit in on the right. -->
    <div id="day" hidden></div>

    <!-- 4.3: the next 14 days. -->
    <div id="ahead" hidden></div>

    <!-- 1.1: the one list. -->
    <ul class="list" id="list" hidden></ul>
    <p class="empty" id="empty" hidden></p>

    <details class="closed" id="closed">
      <summary>Done, dropped and merged</summary>
      <ul class="list list--closed" id="closed-list"></ul>
    </details>

    <footer class="keys">
      <span><kbd>n</kbd> add</span>
      <span><kbd>j</kbd>/<kbd>k</kbd> move</span>
      <span><kbd>x</kbd> done</span>
      <span><kbd>d</kbd> drop</span>
      <span><kbd>e</kbd> edit</span>
      <span><kbd>o</kbd> open source</span>
      <span><kbd>1</kbd>–<kbd>4</kbd> move to quadrant</span>
      <span><kbd>0</kbd> unplace</span>
      <span><kbd>i</kbd> important</span>
      <span><kbd>u</kbd> urgent</span>
      <span><kbd>s</kbd> schedule</span>
      <span><kbd>[</kbd>/<kbd>]</kbd> day before/after</span>
      <span><kbd>t</kbd> today</span>
      <span><kbd>v</kbd> switch view</span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button type="button" id="toast-undo">Undo</button>
  </div>
</body>
</html>
